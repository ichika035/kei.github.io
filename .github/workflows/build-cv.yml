name: Build & Deploy Site

# On every push to main:
#   1. Render cv/cv.html → cv/cv.pdf with headless Chrome (in-CI only;
#      the file is NOT stored in the repo).
#   2. Upload the whole working tree (HTML + the freshly built PDF) as a
#      Pages artifact.
#   3. Deploy to GitHub Pages.
#
# This replaces the previous "commit cv.pdf back to main" approach so
# local pushes never collide with a bot commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled google-chrome:"
            google-chrome --version
          else
            sudo apt-get update
            sudo apt-get install -y chromium-browser
          fi

      - name: Render cv.html → cv.pdf
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          echo "Renderer: $BROWSER"
          "$BROWSER" \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf="$(pwd)/cv/cv.pdf" \
            "file://$(pwd)/cv/cv.html"
          ls -la cv/cv.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
